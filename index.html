<!doctype html>
<html lang="en">
  <!-- Metadata -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenhouse Sensor Logger | Agriculture Dashboard</title>
    <!-- Link to CSS file -->
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="images/favicon.png" />
  </head>

  <!-- Custom Body Code -->
  <body>
    <!-- Header Section -->
    <header class="portal-header">
      <div class="header-content">
        <a href="#">
          <div class="brand">
            <span class="brand-icon">
              <img src="images/favicon.png" alt="Favicon" />
            </span>
            <h1 class="brand-title">
              Greenhouse Sensor Logger
              <span class="brand-subtitle">Dashboard</span>
            </h1>
          </div>
        </a>
        <div class="header-status">
          Active Queue: <span id="queue-count" class="badge-count">0</span>
        </div>
      </div>
    </header>

    <!-- Main Section -->
    <main class="portal-container">
      <aside class="panel form-panel">
        <h2 class="panel-title">Record Telemetry Readings</h2>
        <!-- Hidden Element for Out-of-Bounds Errors -->
        <div
          id="form-error-banner"
          class="alert alert-danger hidden"
          role="alert"
        ></div>

        <form action="#" id="user-form" novalidate>
          <div class="form-group">
            <label for="user-name" class="form-label">
              Full Name<span class="required">*</span>:
            </label>
            <input
              type="text"
              name="user-name"
              id="user-name"
              class="form-control"
              placeholder="Sumaya Uddin"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ph" class="form-label">
                pH<span class="required">*</span>:
              </label>
              <input
                type="number"
                name="ph"
                id="ph"
                class="form-control"
                min="0.0"
                max="14.0"
                step="0.1"
                placeholder="6"
                required
              />
            </div>
            <div class="form-group">
              <label for="ec" class="form-label">
                Electrical Conductivity (mS/cm)<span class="required">*</span>:
              </label>
              <input
                type="number"
                name="ec"
                id="ec"
                class="form-control"
                min="0.0"
                max="10.0"
                step="0.1"
                placeholder="1.5"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="temp" class="form-label">
                Temperature (°F)<span class="required">*</span>:
              </label>
              <input
                type="number"
                name="temp"
                id="temp"
                class="form-control"
                min="-20"
                max="150"
                step="0.1"
                placeholder="68"
                required
              />
            </div>
            <div class="form-group">
              <label for="rh" class="form-label">
                Relative Humidity (%)<span class="required">*</span>:
              </label>
              <input
                type="number"
                name="rh"
                id="rh"
                class="form-control"
                min="0"
                max="100"
                step="0.1"
                placeholder="60"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="bay-id" class="form-label">
              Bay ID<span class="required">*</span>:
            </label>
            <input
              type="number"
              name="bay-id"
              id="bay-id"
              min="1"
              max="100"
              step="1"
              class="form-control"
              placeholder="1"
              required
            />
          </div>

          <button
            type="submit"
            id="btn-submit"
            class="btn btn-primary btn-block"
          >
            Log Sensor Inputs
          </button>
        </form>
      </aside>

      <section class="panel records-panel">
        <div class="records-header">
          <h2 class="panel-title">Sensor Records</h2>
          <button id="btn-clear-all" class="btn btn-outline-danger btn-sm">
            Purge Queue
          </button>
        </div>
        <div id="empty-state" class="empty-state">
          <span class="empty-icon">📝</span>
          <p>No sensor records have been logged yet.</p>
        </div>
        <ul id="records-list" class="records-grid" aria-live="polite"></ul>
      </section>
    </main>

    <!-- Footer Section -->
    <footer class="portal-footer">
      <p>&copy; Greenhouse Sensor Logger Dashboard - Sumaya Uddin</p>
      <a
        href="https://www.flaticon.com/free-icons/agriculture"
        title="Agriculture Icons"
        class="attribute"
        >Agriculture icons created by RanuKumbolo.lab - Flaticon</a
      >
    </footer>
    <!-- Connection to JS file -->
    <script src="script.js"></script>
  </body>
</html>
